<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Escrow | Secure Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --escrow-green: #1b4332;
            --escrow-light: #f8fafc;
            --escrow-accent: #2d6a4f;
        }
        body { background-color: var(--escrow-light); font-family: 'Inter', sans-serif; }
        .brand-gradient { background: linear-gradient(135deg, #1b4332 0%, #081c15 100%); }
        .btn-primary { background-color: #1b4332; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: #2d6a4f; transform: translateY(-1px); }
        .input-focus:focus { border-color: #2d6a4f; ring-color: #2d6a4f; }
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="flex w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="hidden md:flex md:w-1/2 brand-gradient p-12 flex-col justify-between text-white">
            <div>
                <div class="flex items-center gap-2 mb-8">
                    <div class="w-10 h-10 bg-white rounded shadow-sm flex items-center justify-center">
                        <span class="text-green-900 font-bold text-xl">₿</span>
                    </div>
                    <span class="font-bold text-xl tracking-tight">BITCOIN ESCROW</span>
                </div>
                <h2 class="text-3xl font-bold leading-tight mb-4">Secure Trustless Payments</h2>
                <p class="text-green-100 opacity-80">The ultimate layer of protection for global freelance transactions.</p>
            </div>
            <div class="text-sm opacity-60">
                &copy; 2026 Bitcoin Escrow Labs. All rights reserved.
            </div>
        </div>

        <div class="w-full md:w-1/2 p-8 md:p-12">
            <div class="mb-8">
                <h1 id="form-title" class="text-2xl font-bold text-gray-900">Sign In</h1>
                <p class="text-gray-500 text-sm mt-1">Access your secure dashboard</p>
            </div>

            <div class="flex bg-gray-100 rounded-xl p-1 mb-8">
                <button id="role-client" onclick="setRole('client')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white shadow-sm text-green-900">Client</button>
                <button id="role-freelancer" onclick="setRole('freelancer')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-gray-700">Freelancer</button>
            </div>

            <form id="auth-form" class="space-y-5">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" placeholder="Enter your name" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-800 outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" required placeholder="email@example.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-800 outline-none transition">
                </div>

                <div>
                    <div class="flex justify-between mb-1">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-green-700 hover:underline">Forgot?</a>
                    </div>
                    <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-800 outline-none transition">
                </div>

                <button type="submit" id="submit-btn" class="w-full btn-primary text-white font-bold py-3.5 rounded-xl flex justify-center items-center gap-3 shadow-lg">
                    <span id="btn-text">Sign In</span>
                    <div id="btn-spinner" class="spinner hidden"></div>
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-gray-500 text-sm">
                    <span id="footer-prompt">New to Bitcoin Escrow?</span>
                    <button onclick="toggleAuthMode()" id="toggle-btn" class="text-green-800 font-bold hover:underline ml-1">Create Account</button>
                </p>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        let selectedRole = 'client';

        function setRole(role) {
            selectedRole = role;
            const clientBtn = document.getElementById('role-client');
            const freelancerBtn = document.getElementById('role-freelancer');
            
            if(role === 'client') {
                clientBtn.classList.add('bg-white', 'shadow-sm', 'text-green-900');
                freelancerBtn.classList.remove('bg-white', 'shadow-sm', 'text-green-900');
                freelancerBtn.classList.add('text-gray-500');
            } else {
                freelancerBtn.classList.add('bg-white', 'shadow-sm', 'text-green-900');
                clientBtn.classList.remove('bg-white', 'shadow-sm', 'text-green-900');
                clientBtn.classList.add('text-gray-500');
            }
        }

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('btn-text').innerText = isLogin ? 'Sign In' : 'Register';
            document.getElementById('name-field').classList.toggle('hidden');
            document.getElementById('footer-prompt').innerText = isLogin ? 'New to Bitcoin Escrow?' : 'Already have an account?';
            document.getElementById('toggle-btn').innerText = isLogin ? 'Create Account' : 'Sign In';
        }

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const spinner = document.getElementById('btn-spinner');
            const text = document.getElementById('btn-text');

            btn.disabled = true;
            spinner.classList.remove('hidden');
            text.innerText = isLogin ? 'Authenticating...' : 'Processing...';

            // Simulation of API logic
            setTimeout(() => {
                alert(`Validated ${selectedRole} credentials. Connecting to Bitcoin Escrow API...`);
                btn.disabled = false;
                spinner.classList.add('hidden');
                text.innerText = isLogin ? 'Sign In' : 'Register';
            }, 1500);
        });
    </script>
</body>
</html>
